<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting...</title>
    <script type="text/javascript">
      const currentPath = location.pathname;

      // Prevent redirect loop if we're already inside the base path
      if (!currentPath.startsWith("/kader-FE/")) {
        const redirectTo =
          "/kader-FE" + currentPath + location.search + location.hash;
        window.location.replace(redirectTo);
      }
    </script>
  </head>
  <body></body>
</html>
