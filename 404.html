<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting...</title>
    <script type="text/javascript">
      // Redirect all 404s to the index.html while preserving the path
      const redirectTo =
        "/kader-FE" + location.pathname + location.search + location.hash;
      window.location.replace(redirectTo);
    </script>
  </head>
  <body></body>
</html>
